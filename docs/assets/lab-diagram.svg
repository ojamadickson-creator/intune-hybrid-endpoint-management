<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#d97706"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#059669"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#7c3aed"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1010" fill="#f8fafc"/>

  <text x="750" y="46" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">Hybrid Identity and Intune Endpoint Management</text>
  <text x="750" y="72" text-anchor="middle" font-size="15" fill="#475569">ad.beginningdimension.com  to  beginningdimension.onmicrosoft.com</text>

  <!-- ============ ON-PREM ZONE ============ -->
  <rect x="40" y="110" width="620" height="700" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="70" y="142" font-size="18" font-weight="bold" fill="#334155">On-Premises — HQ Site</text>
  <text x="70" y="164" font-size="13" fill="#64748b">192.168.10.0/24  ·  ad.beginningdimension.com</text>

  <rect x="70" y="190" width="280" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="90" y="216" font-size="14" font-weight="bold" fill="#334155">Router / Gateway</text>
  <text x="90" y="236" font-size="12" fill="#64748b">192.168.10.1 · outbound HTTPS to M365</text>
  <line x1="210" y1="254" x2="210" y2="290" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="380" y="190" width="270" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="400" y="216" font-size="14" font-weight="bold" fill="#1e3a8a">SYNCSRV01</text>
  <text x="400" y="236" font-size="12" fill="#64748b">Entra Connect · PHS + OU filtering</text>
  <line x1="515" y1="254" x2="515" y2="290" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="560" y="278" font-size="11" fill="#64748b">directory read</text>

  <rect x="70" y="290" width="270" height="92" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="90" y="316" font-size="14" font-weight="bold" fill="#334155">DC01</text>
  <text x="90" y="336" font-size="12" fill="#64748b">192.168.10.10 · Server 2025</text>
  <text x="90" y="354" font-size="12" fill="#64748b">AD DS · DNS · GC · FSMO</text>

  <rect x="380" y="290" width="270" height="92" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="400" y="316" font-size="14" font-weight="bold" fill="#334155">DC02</text>
  <text x="400" y="336" font-size="12" fill="#64748b">192.168.10.11 · Server 2025</text>
  <text x="400" y="354" font-size="12" fill="#64748b">Replica DC · DNS · GC</text>

  <line x1="340" y1="322" x2="380" y2="322" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="380" y1="350" x2="340" y2="350" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="360" y="310" text-anchor="middle" font-size="11" fill="#64748b">replication</text>

  <rect x="70" y="430" width="560" height="104" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="90" y="456" font-size="13" font-weight="bold" fill="#334155">Beginningdimension OUs + Group Policy</text>
  <text x="90" y="476" font-size="12" fill="#64748b">Users · Computers\Workstations · Admin\Tier0 · Pilot</text>
  <text x="90" y="494" font-size="12" fill="#64748b">GPOs: Sec-Workstation-Baseline · Cfg-WindowsLAPS ·</text>
  <text x="90" y="510" font-size="12" fill="#64748b">Cfg-WindowsUpdate · Cfg-AutoMDMEnrollment (new)</text>
  <line x1="210" y1="382" x2="210" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="70" y="580" width="560" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="608" font-size="15" font-weight="bold" fill="#1e3a8a">CLIENT01 — pilot device</text>
  <text x="90" y="628" font-size="12" fill="#64748b">192.168.10.20 · Windows 11 Pro · TPM 2.0 · UEFI</text>
  <text x="90" y="646" font-size="12" fill="#64748b">Domain-joined (Workstations OU) + Entra hybrid joined</text>
  <text x="90" y="664" font-size="12" fill="#64748b">Intune enrolled · Company Portal · BitLocker escrow</text>
  <text x="90" y="690" font-size="12" fill="#059669" font-weight="bold">Managed by Intune: compliance · baseline · apps · updates</text>
  <line x1="350" y1="534" x2="350" y2="580" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- ============ CLOUD ZONE ============ -->
  <rect x="840" y="110" width="620" height="700" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="870" y="142" font-size="18" font-weight="bold" fill="#1e40af">Microsoft 365 Tenant</text>
  <text x="870" y="164" font-size="13" fill="#3b82f6">beginningdimension.onmicrosoft.com · Business Premium</text>

  <rect x="870" y="190" width="270" height="110" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="890" y="216" font-size="14" font-weight="bold" fill="#1e3a8a">Microsoft Entra ID (P1)</text>
  <text x="890" y="236" font-size="12" fill="#64748b">Identities synced via PHS</text>
  <text x="890" y="254" font-size="12" fill="#64748b">Hybrid-joined device objects</text>
  <text x="890" y="272" font-size="12" fill="#64748b">BitLocker recovery keys</text>

  <rect x="1190" y="190" width="250" height="110" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1210" y="216" font-size="14" font-weight="bold" fill="#4c1d95">Conditional Access</text>
  <text x="1210" y="236" font-size="12" fill="#64748b">CA-MFA-AllUsers</text>
  <text x="1210" y="254" font-size="12" fill="#64748b">CA-RequireCompliantDevice</text>
  <text x="1210" y="272" font-size="12" fill="#64748b">Report-only, then On</text>

  <rect x="870" y="470" width="270" height="110" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="890" y="496" font-size="14" font-weight="bold" fill="#1e3a8a">Microsoft Intune (Plan 1)</text>
  <text x="890" y="516" font-size="12" fill="#64748b">Compliance + custom rules</text>
  <text x="890" y="534" font-size="12" fill="#64748b">MDM security baseline</text>
  <text x="890" y="552" font-size="12" fill="#64748b">Config profiles · apps · updates</text>

  <rect x="870" y="650" width="270" height="110" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="890" y="676" font-size="14" font-weight="bold" fill="#064e3b">Defender for Business</text>
  <text x="890" y="696" font-size="12" fill="#64748b">Automatic onboarding of</text>
  <text x="890" y="714" font-size="12" fill="#64748b">Intune-enrolled devices</text>
  <text x="890" y="732" font-size="12" fill="#64748b">AV + firewall policies from Intune</text>

  <rect x="1190" y="650" width="250" height="110" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1210" y="676" font-size="14" font-weight="bold" fill="#7c2d12">Cloud resources</text>
  <text x="1210" y="696" font-size="12" fill="#64748b">Exchange Online · SharePoint</text>
  <text x="1210" y="714" font-size="12" fill="#64748b">Microsoft 365 Apps</text>
  <text x="1210" y="732" font-size="12" fill="#64748b">Compliant devices only</text>

  <!-- ============ FLOWS ============ -->
  <!-- 1. Entra Connect sync -->
  <path d="M 650 222 C 730 222, 790 235, 868 248" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="700" y="272" font-size="12" font-weight="bold" fill="#2563eb">Entra Connect sync</text>
  <text x="700" y="288" font-size="11" fill="#3b82f6">PHS + OU filtering</text>

  <!-- 2. Hybrid join -->
  <path d="M 630 595 C 780 595, 870 420, 945 302" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="800" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">Hybrid join</text>
  <text x="800" y="486" text-anchor="middle" font-size="11" fill="#b45309">(SCP-published)</text>

  <!-- 3. Automatic MDM enrollment -->
  <path d="M 630 630 C 740 630, 810 575, 870 532" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowOrange)"/>
  <text x="655" y="660" font-size="12" font-weight="bold" fill="#d97706">Automatic MDM enrollment</text>
  <text x="655" y="676" font-size="11" fill="#b45309">GPO + MDM user scope</text>

  <!-- 4. Policies back to device -->
  <path d="M 920 580 C 860 680, 760 715, 634 702" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="800" y="768" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">Policies · apps · updates · scripts</text>

  <!-- 5. Compliance state -->
  <line x1="1140" y1="245" x2="1190" y2="245" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="1165" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">compliance state</text>
  <text x="1165" y="192" text-anchor="middle" font-size="11" fill="#6d28d9">+ MFA signal</text>

  <!-- 6. Intune -> Defender onboarding -->
  <line x1="1005" y1="580" x2="1005" y2="650" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="1016" y="620" font-size="11" fill="#059669">onboarding</text>

  <!-- 7. CA -> cloud resources -->
  <line x1="1315" y1="300" x2="1315" y2="650" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="1328" y="475" font-size="11" fill="#6d28d9">grant / block</text>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="840" width="1420" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="868" font-size="14" font-weight="bold" fill="#334155">Legend</text>

  <rect x="70" y="886" width="26" height="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="106" y="900" font-size="12" fill="#475569">Existing on-premises (AD project)</text>

  <rect x="360" y="886" width="26" height="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="396" y="900" font-size="12" fill="#475569">Cloud services (Business Premium)</text>

  <line x1="660" y1="895" x2="700" y2="895" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="710" y="900" font-size="12" fill="#475569">Identity sync (PHS)</text>

  <line x1="880" y1="895" x2="920" y2="895" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="930" y="900" font-size="12" fill="#475569">Device join / enrollment</text>

  <line x1="1110" y1="895" x2="1150" y2="895" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="1160" y="900" font-size="12" fill="#475569">Management traffic (Intune to device)</text>

  <line x1="70" y1="935" x2="110" y2="935" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="120" y="940" font-size="12" fill="#475569">Access enforcement (Conditional Access)</text>

  <text x="60" y="968" font-size="11" fill="#94a3b8">Settings ownership: GPOs manage identity, DNS, DC hardening, Windows LAPS. Intune manages client health, apps, updates, compliance. One setting, one owner — see docs/settings-ownership.md.</text>
</svg>
